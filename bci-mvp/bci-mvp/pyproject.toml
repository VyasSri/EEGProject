[project]
name = "bci-mvp"
version = "0.1.0"
description = "Live motor-imagery BCI cursor control with reproducible training"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "mlflow>=2.9",
    "optuna>=3.5",
    "aiohttp>=3.9",
    "pylsl>=1.16",
    "scikit-learn>=1.3",   # metrics: f1_score
    "moabb>=1.0",          # public MI datasets (BCI IV 2a etc.); optional
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
